[project]
name = "bursatrack-api"
version = "0.1.0"
description = "BursaTrack FastAPI backend"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.115,<1.0",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "email-validator>=2.1",
    "bcrypt>=4.1",
    "PyJWT[crypto]>=2.8",
    "python-dotenv>=1.0",
    "slowapi>=0.1.9",
    "structlog>=24.1",
    "resend>=2.0",
    "yfinance>=1.5.2",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "cryptography>=42.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
