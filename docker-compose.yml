services:
  postgres:
    image: postgres:16
    container_name: bursatrack-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bursatrack
      POSTGRES_PASSWORD: bursatrack
      POSTGRES_DB: bursatrack
    ports:
      # Host port 5433 (not 5432) to avoid colliding with any other local
      # Postgres install/service already bound to the default port.
      - "5433:5432"
    volumes:
      - bursatrack_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bursatrack -d bursatrack"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: bursatrack-backend
    restart: unless-stopped
    env_file:
      # Copy backend/.env.example to backend/.env first (DEP-9.1 DoD: the
      # only manual step before `docker-compose up`).
      - ./backend/.env
    environment:
      # Overrides .env's localhost-based DATABASE_URL — inside the compose
      # network, the backend reaches Postgres via the service name, not
      # localhost:5433 (that port mapping is for host-machine access only).
      DATABASE_URL: postgresql+asyncpg://bursatrack:bursatrack@postgres:5432/bursatrack
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      # Named volume for the venv so the bind mount above doesn't shadow the
      # dependencies installed into the image at build time.
      - bursatrack_backend_venv:/app/.venv
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: bursatrack-frontend
    restart: unless-stopped
    env_file:
      # Copy frontend/.env.example to frontend/.env.local first.
      - ./frontend/.env.local
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - bursatrack_frontend_node_modules:/app/node_modules
      - bursatrack_frontend_next:/app/.next
    depends_on:
      - backend

volumes:
  bursatrack_pg_data:
  bursatrack_backend_venv:
  bursatrack_frontend_node_modules:
  bursatrack_frontend_next:
